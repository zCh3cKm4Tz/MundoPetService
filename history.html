<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Agendamentos e Compras</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilo para o botão "Home" */
        .home-button {
            display: inline-block;
            margin: 10px 0;
            padding: 8px 15px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
        }

        .home-button:hover {
            background-color: #0056b3;
        }

        /* Estilos gerais */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            margin-top: 20px;
            text-align: center;
        }

        h2 {
            font-size: 24px;
            color: #333;
        }

        main {
            width: 90%;
            max-width: 800px;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        thead {
            background-color: #f2f2f2;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #007bff;
            color: #fff;
            font-weight: bold;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #e0e7ff;
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="home-button">Home</a>
        <h2>Histórico de Agendamentos e Compras</h2>
    </header>
    <main>
        <table>
            <thead>
                <tr>
                    <th>Tipo</th>
                    <th>Descrição</th>
                    <th>Data</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Consulta Veterinária</td>
                    <td>Consulta geral para pet</td>
                    <td>01/11/2024</td>
                    <td>Concluído</td>
                </tr>
                <tr>
                    <td>Compra</td>
                    <td>Ração Premium 3kg</td>
                    <td>29/10/2024</td>
                    <td>Em andamento</td>
                </tr>
                <!-- Adicione mais linhas conforme necessário -->
            </tbody>
        </table>
    </main>
</body>
</html>
