<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pet Services</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        form div {
            margin-bottom: 15px;
        }
        form label {
            display: inline-block;
            width: 100px;
        }
        form input {
            width: 200px;
            padding: 5px;
        }
    </style>
    <script defer>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('login-form');

            if (loginForm) {
                loginForm.addEventListener('submit', async (event) => {
                    event.preventDefault(); // Evita o comportamento padrão de recarregar a página

                    const formData = new FormData(loginForm);

                    try {
                        // Fazendo o POST para o arquivo PHP de login
                        const response = await fetch('login.php', {
                            method: 'POST',
                            body: formData
                        });

                        if (!response.ok) {
                            throw new Error(`Erro na requisição: ${response.status}`);
                        }

                        const data = await response.text();
                        console.log("Resposta do servidor:", data);

                        if (data.includes('sucesso')) {
                            alert('Login realizado com sucesso!');
                            window.location.href = 'index.html'; // Redireciona para a página inicial
                        } else {
                            alert('Erro ao logar: ' + data);
                        }
                    } catch (error) {
                        console.error('Erro:', error);
                        alert('Erro durante o envio: ' + error.message);
                    }
                });
            }
        });
    </script>
</head>
<body>
    <header>
        <div class="logo">Logotipo</div>
        <nav class="navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="servicos.html">Serviços</a></li>
                <li><a href="produtos.html">Produtos</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
        <div class="user-actions" id="user-actions">
            <a href="login.html" id="login-link">Login</a> | <a href="registro.html" id="register-link">Registro</a> | <a href="carrinho.html">Carrinho</a>
        </div>
    </header>
    <main>
        <section class="login">
            <h1>Login</h1>
            <!-- Formulário de login -->
            <form id="login-form" action="login.php" method="POST">
                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div>
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" required>
                </div>
                <button type="submit">Login</button>
            </form>
            <p><a href="recuperar-senha.html">Esqueceu sua senha?</a></p>
        </section>
    </main>
    <footer>
        <p>© 2024 Pet Services. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
